<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<title>spine parity — real bundle render</title>
<style>
  html[data-theme="light"] {
    --dsw-alias-label-primary: #1f2328; --dsw-alias-label-secondary: #6b7280;
    --dsw-alias-border-l2: #d8dde4; --dsw-alias-fill-l2: #f2f4f7;
    --dsw-alias-state-success-primary: #15803d; --dsw-alias-state-error-primary: #d1242f;
    --dsw-alias-state-warn-primary: #b45309; --dsw-alias-state-idle-primary: #c3c9d2;
    --dsw-alias-state-business-primary: #2f6fed;
    --dsw-font-family-sans: "Noto Sans CJK SC", "Source Han Sans SC", system-ui, sans-serif;
  }
  html, body { margin: 0; padding: 0; background: #fff; color: #1f2328;
    font-family: var(--dsw-font-family-sans); }
  .frame { background: #fff; box-sizing: border-box; padding: 0; margin: 0 0 24px; }
  .frame-label { font: 12px/1.4 monospace; color: #666; padding: 2px 4px; }
  #results { white-space: pre-wrap; font: 12px/1.5 monospace; }
</style>
</head>
<body>
<div id="frames"></div>
<pre id="results">PENDING</pre>
<script>
  window.__ModuleLoader__ = { load: function (spec) { window.__registration = spec } }
</script>
<script src="file:///home/fish/projects_mine/dsh-grok-workflow/lib/client.js"></script>
<script>
(function () {
  'use strict'
  var reg = window.__registration
  if (reg === undefined || reg === null) throw new Error('bundle did not register a module')

  // ---- mini React ---------------------------------------------------------
  // The bundle is React-flavoured: it builds a plain element tree and uses five
  // hooks. This shim runs the component for real against a real DOM, so flex
  // layout, media queries and getBoundingClientRect are the browser's answers.
  var runtime = { cells: [], index: 0, effects: [], dirty: false }

  function cell(index, initial) {
    if (!(index in runtime.cells)) runtime.cells[index] = initial
    return runtime.cells[index]
  }

  var ReactShim = {
    createElement: function (type, props) {
      var children = Array.prototype.slice.call(arguments, 2).flat(Infinity)
      var element = { type: type, props: props || {}, children: children }
      return typeof type === 'function' ? type(element.props) : element
    },
    useState: function (initial) {
      var index = runtime.index++
      var store = cell(index, { value: typeof initial === 'function' ? initial() : initial })
      var set = function (next) {
        var value = typeof next === 'function' ? next(store.value) : next
        if (!Object.is(value, store.value)) { store.value = value; runtime.dirty = true }
      }
      return [store.value, set]
    },
    useRef: function (initial) {
      var index = runtime.index++
      return cell(index, { current: initial === undefined ? null : initial })
    },
    useMemo: function (factory, deps) {
      var index = runtime.index++
      var store = cell(index, { value: undefined, deps: undefined })
      var previous = store.deps
      var changed = previous === undefined || deps === undefined || previous.length !== deps.length
      if (!changed) {
        for (var i = 0; i < deps.length; i++) if (!Object.is(previous[i], deps[i])) { changed = true; break }
      }
      if (changed) { store.value = factory(); store.deps = deps }
      return store.value
    },
    useEffect: function (fn) { runtime.effects.push(fn) },
    useSyncExternalStore: function (_subscribe, getSnapshot) { return getSnapshot() },
  }

  var exports = reg.factory(function (id) {
    if (id === 'react') return ReactShim
    throw new Error('unexpected require: ' + id)
  })
  var progress = exports.GROK_WORKFLOW_PROGRESS
  var t = exports.GROK_WORKFLOW_INTERNALS.translator('zh')
  var css = progress.css
  var component = progress.component

  // ---- stub tree -> real DOM ---------------------------------------------
  var SVG_NS = 'http://www.w3.org/2000/svg'
  var SVG_TAGS = { svg: 1, g: 1, path: 1, line: 1, circle: 1, polyline: 1, polygon: 1, rect: 1 }
  var ATTR_ALIAS = { strokeWidth: 'stroke-width', strokeDasharray: 'stroke-dasharray',
    strokeLinecap: 'stroke-linecap' }

  function applyProps(el, props) {
    Object.keys(props).forEach(function (key) {
      var value = props[key]
      if (value === undefined || value === null || value === false) return
      if (key === 'key' || key === 'children') return
      if (key === 'ref') { if (value !== null && typeof value === 'object') value.current = el; return }
      if (key === 'className') { el.setAttribute('class', Array.isArray(value) ? value.filter(Boolean).join(' ') : String(value)); return }
      if (key === 'style') {
        Object.keys(value).forEach(function (name) {
          var cssValue = value[name]
          if (cssValue === undefined || cssValue === null) return
          if (name.slice(0, 2) === '--') el.style.setProperty(name, String(cssValue))
          else el.style[name] = cssValue
        })
        return
      }
      if (typeof value === 'function') return
      el.setAttribute(ATTR_ALIAS[key] || key, String(value))
    })
  }

  function renderNode(node, parent) {
    if (node === null || node === undefined || node === false || node === true) return
    if (Array.isArray(node)) { node.forEach(function (child) { renderNode(child, parent) }); return }
    if (typeof node === 'string' || typeof node === 'number') {
      parent.appendChild(document.createTextNode(String(node)))
      return
    }
    var el = SVG_TAGS[node.type] === 1
      ? document.createElementNS(SVG_NS, node.type)
      : document.createElement(node.type)
    applyProps(el, node.props)
    node.children.forEach(function (child) { renderNode(child, el) })
    parent.appendChild(el)
  }

  // ---- the run under test -------------------------------------------------
  // Same shape the recorder writes: eleven rows over three phases, two verifiers,
  // one failure, one still open.
  var members = [
    { seq: 10, label: '规划', phase: '规划', childId: 'c10', order: 0, outcome: 'completed', startedAt: 0, endedAt: 3000 },
    { seq: 11, label: '执行', phase: '执行', childId: 'c11', order: 1, outcome: 'completed', startedAt: 3000, endedAt: 7000 },
    { seq: 12, label: '执行', phase: '执行', childId: 'c12', order: 2, outcome: 'completed', startedAt: 3000, endedAt: 7100 },
    { seq: 13, label: '执行', phase: '执行', childId: 'c13', order: 3, outcome: 'completed', startedAt: 3000, endedAt: 6100 },
    { seq: 14, label: '执行', phase: '执行', childId: 'c14', order: 4, outcome: 'completed', startedAt: 3000, endedAt: 8200 },
    { seq: 15, label: '执行', phase: '执行', childId: 'c15', order: 5, outcome: 'completed', startedAt: 3000, endedAt: 8300 },
    { seq: 16, label: '执行', phase: '执行', childId: 'c16', order: 6, outcome: 'completed', startedAt: 3000, endedAt: 7300 },
    { seq: 17, label: '执行', phase: '执行', childId: 'c17', order: 7, outcome: 'completed', startedAt: 3000, endedAt: 8000 },
    { seq: 18, label: '执行', phase: '执行', childId: 'c18', order: 8, outcome: 'failed', startedAt: 3000, endedAt: 10800 },
    { seq: 30, label: '检查', phase: '检查', childId: 'c30', order: 9, outcome: 'completed', startedAt: 11000, endedAt: 20400 },
    { seq: 31, label: '检查', phase: '检查', childId: 'c31', order: 10, startedAt: 11000 },
  ]
  var run = { runId: 'r-parity', name: '任务团队', anchorSeq: 1, members: members }
  var snapshot = { runs: [run], activeRun: run }

  function props() {
    return {
      t: t,
      progressT: t,
      useGrokProgress: function (select) { return select(snapshot) },
      canOpen: function () { return true },
      openChild: function () {},
    }
  }

  function mount(width) {
    var frame = document.createElement('div')
    frame.className = 'frame'
    frame.setAttribute('data-frame-width', String(width))
    frame.style.width = width + 'px'
    var label = document.createElement('div')
    label.className = 'frame-label'
    label.textContent = 'width=' + width + 'px'
    frame.appendChild(label)
    document.getElementById('frames').appendChild(frame)

    var host = document.createElement('div')
    host.style.width = width + 'px'
    frame.appendChild(host)

    // React re-renders until the state stops moving: the wire effect measures the
    // band, sets the indent, and that changes where the cards sit, so the second
    // measurement has to happen against the re-laid-out band. Loop until it settles.
    runtime.cells = []
    for (var pass = 0; pass < 6; pass++) {
      runtime.index = 0
      runtime.effects = []
      runtime.dirty = false
      host.textContent = ''
      renderNode(component(props()), host)
      runtime.effects.forEach(function (fn) { fn() })
      if (!runtime.dirty) break
    }
    return host
  }

  function measure(width, host) {
    var track = host.querySelector('[data-gw-progress-track]')
    var segs = Array.prototype.slice.call(host.querySelectorAll('.gw-progress-track > .gw-progress-seg'))
    var band = host.querySelector('[data-gw-progress-tasks]')
    var rectOf = function (el) {
      var r = el.getBoundingClientRect()
      return { left: +r.left.toFixed(2), top: +r.top.toFixed(2), width: +r.width.toFixed(2), height: +r.height.toFixed(2) }
    }
    var rows = segs.map(function (seg) {
      var labelEl = seg.querySelector('[data-gw-progress-label]')
      return {
        key: seg.getAttribute('data-node-key'),
        text: labelEl === null ? null : labelEl.textContent,
        state: seg.getAttribute('data-state'),
        kind: seg.getAttribute('data-kind'),
        rect: rectOf(seg),
      }
    })
    var tops = rows.map(function (row) { return Math.round(row.rect.top + 0.5) })
    var heights = rows.map(function (row) { return Math.round(row.rect.height + 0.5) })
    var trackRect = rectOf(track)
    var bandRect = band === null ? null : rectOf(band)
    return {
      width: width,
      spineCount: rows.length,
      keys: rows.map(function (row) { return row.key }),
      labels: rows.map(function (row) { return row.text }),
      states: rows.map(function (row) { return row.state }),
      kinds: rows.map(function (row) { return row.kind }),
      segTops: rows.map(function (row) { return row.rect.top }),
      segHeights: rows.map(function (row) { return row.rect.height }),
      segRects: rows.map(function (row) { return row.rect }),
      distinctTops: Array.from(new Set(tops)),
      distinctHeights: Array.from(new Set(heights)),
      singleRow: new Set(tops).size === 1,
      trackRect: trackRect,
      trackScrollWidth: track.scrollWidth,
      trackClientWidth: track.clientWidth,
      horizontalOverflow: track.scrollWidth > track.clientWidth + 1,
      flexDirection: getComputedStyle(track).flexDirection,
      spineBottom: +(trackRect.top + trackRect.height).toFixed(2),
      bandTop: bandRect === null ? null : bandRect.top,
      bandGap: bandRect === null ? null : +(bandRect.top - (trackRect.top + trackRect.height)).toFixed(2),
      cardCount: host.querySelectorAll('[data-gw-progress-task]').length,
      wireCount: host.querySelectorAll('.gw-progress-wire').length,
      wireTrunks: host.querySelectorAll('[data-gw-progress-wire="trunk"]').length,
      wireBranches: host.querySelectorAll('[data-gw-progress-wire="branch"]').length,
      settleTones: Array.prototype.slice.call(host.querySelectorAll('[data-gw-progress-settle-part]'))
        .map(function (part) { return part.getAttribute('data-tone') }),
      labelFontSize: (function () {
        var el = host.querySelector('[data-gw-progress-label]')
        return el === null ? null : getComputedStyle(el).fontSize
      })(),
      cssRuleCount: (host.querySelector('[data-gw-progress-css]') === null ? 0 : 1),
      textOfSpine: rows.map(function (row) { return row.text }).join(' | '),
    }
  }

  // `?w=760` renders exactly one frame inside a viewport of that width, so the
  // bundle's own media queries see the width the user's window would have.
  var only = (function () {
    var match = /[?&]w=(\d+)/.exec(window.location.search)
    return match === null ? null : Number(match[1])
  })()
  var widths = only === null ? [1440, 1280, 1024, 800, 760, 759, 600, 420] : [only]
  var out = []
  widths.forEach(function (width) {
    out.push(measure(width, mount(width)))
  })

  // The spine is the template, not the plan: a run that declares twelve plan tasks
  // must still show seven stages and put the twelve rows in the band below.
  var planRun = {
    runId: 'r-plan',
    name: '任务团队',
    anchorSeq: 1,
    members: Array.from({ length: 12 }, function (_unused, index) {
      return {
        seq: index + 1,
        label: '执行',
        phase: '任务 ' + (index + 1) + ' · 步骤',
        childId: 'p' + (index + 1),
        order: index,
        outcome: 'completed',
        startedAt: index * 1000,
        endedAt: index * 1000 + 900,
      }
    }),
    stopReason: 'completed',
  }
  var planSnapshot = { runs: [planRun], activeRun: planRun }
  snapshot = planSnapshot
  var planHost = mount(1440)
  document.getElementById('frames').lastChild.setAttribute('data-case', 'twelve-plan-tasks')
  window.__PLAN_HEAVY = measure(1440, planHost)
  window.__MEASUREMENTS = out
  document.getElementById('results').textContent =
    'JSON_START' + JSON.stringify({ measurements: out, planHeavy: window.__PLAN_HEAVY, cssRules: css.length }) + 'JSON_END'
  document.title = 'done'
})()
</script>
</body>
