        compat:
          supportsDeveloperRole: false
          supportsStore: false
        models:
          - id: soak/plan-live
            name: soak/plan-live
            contextWindow: 500000
            maxTokens: 65536
          - id: soak/work-live
            name: soak/work-live
            contextWindow: 500000
            maxTokens: 65536
          - id: soak/judge-live
            name: soak/judge-live
            contextWindow: 500000
            maxTokens: 65536
          - id: soak/sup-live
            name: soak/sup-live
            contextWindow: 500000
            maxTokens: 65536
          - id: soak/synth-live
            name: soak/synth-live
            contextWindow: 500000
            maxTokens: 65536
      soak-hang:
