    model: wb/global:deepseek-v4.1-flash

- id: workflow-ptc
  name: '@deepseek-ai/dsh-workflow-ptc'
  config:
    provider: spawn
  disabled: false

- insert:
    - id: grok-workflow
      name: /home/fish/projects_mine/dsh-grok-workflow/.tmp/wt-rel-0.13.29/lib/index.js
      config:
        mode: full
        grokDefault: 'off'
        maxConcurrency: 1
        timeoutMs: 1800000
        childTimeoutMs: 90000
        loopEnabled: false
        roles:
          planner:
            - provider: soak-pool
              model: soak/plan-live
          worker:
            - provider: soak-auth
              model: soak/auth-bad
          verifier:
            - provider: soak-pool
              model: soak/judge-live
          supervisor:
            - provider: soak-pool
              model: soak/sup-live
          synthesizer:
