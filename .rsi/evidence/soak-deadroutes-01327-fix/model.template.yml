# Soak overlay for release/0.13.27 — the dead-route path on a real engine.
#
# Two fake providers (127.0.0.1:18471 always 503, :18472 never answers) and one
# real one (the local gateway), so the worker chain is [dead route, live route].
# The plugin row is INSERTED (the headless profile has no such bundle) and points
# at the built lib/ of the worktree under test, so what runs is that change.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true
- id: llm-deepseek-account
  name: '@deepseek-ai/dsh-llm-deepseek-account'
  disabled: true

- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      soak-live:
        displayName: Soak live
        api: openai-completions
        baseURL: http://127.0.0.1:18088/openai/v1
        apiKeyEnv: BIFROST_VIRTUAL_KEY
        compat:
          supportsDeveloperRole: false
          supportsStore: false
        models:
          - id: wb/cn:deepseek-v4.1-flash
            name: soak live flash
            contextWindow: 500000
            maxTokens: 65536
      soak-dead:
        displayName: Soak dead (503)
        api: openai-completions
        baseURL: http://127.0.0.1:18471/openai/v1
        apiKeyEnv: BIFROST_VIRTUAL_KEY
        compat:
          supportsDeveloperRole: false
          supportsStore: false
        models:
          - id: soak/dead-model
            name: soak dead model
            contextWindow: 500000
            maxTokens: 65536
      soak-hang:
        displayName: Soak hang
        api: openai-completions
        baseURL: http://127.0.0.1:18472/openai/v1
        apiKeyEnv: BIFROST_VIRTUAL_KEY
        compat:
          supportsDeveloperRole: false
          supportsStore: false
        models:
          - id: soak/hang-model
            name: soak hang model
            contextWindow: 500000
            maxTokens: 65536

- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: soak-live
    model: wb/cn:deepseek-v4.1-flash

- id: workflow-ptc
  name: '@deepseek-ai/dsh-workflow-ptc'
  config:
    provider: spawn
  disabled: false

- insert:
    - id: grok-workflow
      name: PLUGIN_ENTRY
      config:
        mode: full
        grokDefault: on
        maxConcurrency: 1
        timeoutMs: 1800000
        childTimeoutMs: CHILD_TIMEOUT_MS
        loopEnabled: false
        roles:
          planner:
            - provider: soak-live
              model: wb/cn:deepseek-v4.1-flash
          worker:
            - provider: DEAD_PROVIDER
              model: DEAD_MODEL
            - provider: soak-live
              model: wb/cn:deepseek-v4.1-flash
          verifier:
            - provider: soak-live
              model: wb/cn:deepseek-v4.1-flash
          synthesizer:
            - provider: soak-live
              model: wb/cn:deepseek-v4.1-flash
          supervisor:
            - provider: soak-live
              model: wb/cn:deepseek-v4.1-flash
