# Isolated soak overlay (2026-11-24, audit-render-half).
#
# What is mounted: the tarball-installed copy of the build under test, resolved
# by package name from THIS scratch home's `headless-soak` profile — not a path
# into the worktree under test, and not a symlink.
#
# Why a headless app shell: the live `web` profile is the install target (that is
# where the packed tarball went, and where the version read-back is taken), but
# the web app accepts no task argument (`dsh --profile web "x"` →
# `error: too many arguments`), and a second long-lived server is out of bounds
# for this block. So the one-shot run uses the shipped headless app in the same
# scratch DSH_HOME; the plugin row mounted here is the installed package.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true
- id: llm-deepseek-account
  name: '@deepseek-ai/dsh-llm-deepseek-account'
  disabled: true

- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      soak-live:
        displayName: Soak live (machine gateway, direct)
        api: openai-completions
        baseURL: http://127.0.0.1:18088/openai/v1
        apiKeyEnv: BIFROST_VIRTUAL_KEY
        compat:
          supportsDeveloperRole: false
          supportsStore: false
        models:
          - id: agent2api/deepseek-v4.1-flash
            name: soak live
            contextWindow: 500000
            maxTokens: 65536

- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: soak-live
    model: agent2api/deepseek-v4.1-flash

- id: workflow-ptc
  name: '@deepseek-ai/dsh-workflow-ptc'
  config:
    provider: spawn
  disabled: false

- insert:
    - id: grok-workflow
      name: dsh-grok-workflow
      config:
        mode: full
        grokDefault: 'on'
        maxConcurrency: 2
        timeoutMs: 900000
        childTimeoutMs: 300000
        loopEnabled: false
        roles:
          planner:
            - provider: soak-live
              model: agent2api/deepseek-v4.1-flash
          worker:
            - provider: soak-live
              model: agent2api/deepseek-v4.1-flash
          verifier:
            - provider: soak-live
              model: agent2api/deepseek-v4.1-flash
          supervisor:
            - provider: soak-live
              model: agent2api/deepseek-v4.1-flash
          synthesizer:
            - provider: soak-live
              model: agent2api/deepseek-v4.1-flash
