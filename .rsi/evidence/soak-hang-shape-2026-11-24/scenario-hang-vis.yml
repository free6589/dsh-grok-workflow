# Soak overlay for the 2026-11-24 hang-shape round.
#
# Generated by gen-patch.mjs. Fake endpoints 127.0.0.1:18591 (the hanging route
# under test), :18592 (401, unused), :18593 (proxy to the machine's own gateway
# 127.0.0.1:18088); every completion is counted per (port, model) in the
# gateway log. The plugin row is INSERTED (the headless profile has no such
# bundle) and points at this repository's built lib/index.js, read-only.
#
# No guardianModel on purpose: a guardian route appends a 300 s wait slice to
# every timed-out call and would destroy the childTimeoutMs measurement.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true
- id: llm-deepseek-account
  name: '@deepseek-ai/dsh-llm-deepseek-account'
  disabled: true

- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      soak-live:
        displayName: Soak live (the machine's own gateway, direct — the outer agent and planning legs use this)
        api: openai-completions
        baseURL: http://127.0.0.1:18088/openai/v1
        apiKeyEnv: BIFROST_VIRTUAL_KEY
        compat:
          supportsDeveloperRole: false
          supportsStore: false
        models:
          - id: wb/global:deepseek-v4.1-flash
            name: soak live flash
            contextWindow: 500000
            maxTokens: 65536
      soak-pool:
        displayName: "Soak pool (18593, proxies to the live gateway)"
        api: openai-completions
        baseURL: http://127.0.0.1:18593/openai/v1
        apiKeyEnv: BIFROST_VIRTUAL_KEY
        compat:
          supportsDeveloperRole: false
          supportsStore: false
        models:
          - id: soak/plan-live
            name: soak/plan-live
            contextWindow: 500000
            maxTokens: 65536
          - id: soak/work-live
            name: soak/work-live
            contextWindow: 500000
            maxTokens: 65536
          - id: soak/judge-live
            name: soak/judge-live
            contextWindow: 500000
            maxTokens: 65536
          - id: soak/sup-live
            name: soak/sup-live
            contextWindow: 500000
            maxTokens: 65536
          - id: soak/synth-live
            name: soak/synth-live
            contextWindow: 500000
            maxTokens: 65536
      soak-hang:
        displayName: "Soak hang 18591 — the route under test: never answers"
        api: openai-completions
        baseURL: http://127.0.0.1:18591/openai/v1
        apiKeyEnv: BIFROST_VIRTUAL_KEY
        compat:
          supportsDeveloperRole: false
          supportsStore: false
        models:
          - id: soak/hang-always
            name: soak/hang-always
            contextWindow: 500000
            maxTokens: 65536
      soak-auth:
        displayName: "Soak auth (18592, every completion 401 — unused this round)"
        api: openai-completions
        baseURL: http://127.0.0.1:18592/openai/v1
        apiKeyEnv: BIFROST_VIRTUAL_KEY
        compat:
          supportsDeveloperRole: false
          supportsStore: false
        models:
          - id: soak/auth-bad
            name: soak/auth-bad
            contextWindow: 500000
            maxTokens: 65536

- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: soak-live
    model: wb/global:deepseek-v4.1-flash

- id: workflow-ptc
  name: '@deepseek-ai/dsh-workflow-ptc'
  config:
    provider: spawn
  disabled: false

- insert:
    - id: grok-workflow
      name: /home/fish/projects_mine/dsh-grok-workflow/.tmp/soak-hang/lib-vis/index.js
      config:
        mode: full
        grokDefault: 'off'
        maxConcurrency: 1
        timeoutMs: 1800000
        childTimeoutMs: 45000
        loopEnabled: false
        roles:
          planner:
            - provider: soak-live
              model: wb/global:deepseek-v4.1-flash
          worker:
            - provider: soak-hang
              model: soak/hang-always
            - provider: soak-pool
              model: soak/work-live
          verifier:
            - provider: soak-pool
              model: soak/judge-live
          supervisor:
            - provider: soak-pool
              model: soak/sup-live
          synthesizer:
            - provider: soak-pool
              model: soak/synth-live
