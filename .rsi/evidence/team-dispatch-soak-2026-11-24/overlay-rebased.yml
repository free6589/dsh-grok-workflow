# Soak overlay — build under test: /home/fish/projects_mine/dsh-grok-workflow/.tmp/soak-td/rebased-build/lib/index.js
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true
- id: llm-deepseek-account
  name: '@deepseek-ai/dsh-llm-deepseek-account'
  disabled: true

- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      soak-live:
        displayName: Soak live (machine gateway, direct)
        api: openai-completions
        baseURL: http://127.0.0.1:18088/openai/v1
        apiKeyEnv: BIFROST_VIRTUAL_KEY
        compat:
          supportsDeveloperRole: false
          supportsStore: false
        models:
          - id: agent2api/deepseek-v4.1-flash
            name: soak live
            contextWindow: 500000
            maxTokens: 65536

- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: soak-live
    model: agent2api/deepseek-v4.1-flash

- id: workflow-ptc
  name: '@deepseek-ai/dsh-workflow-ptc'
  config:
    provider: spawn
  disabled: false

- insert:
    - id: grok-workflow
      name: /home/fish/projects_mine/dsh-grok-workflow/.tmp/soak-td/rebased-build/lib/index.js
      config:
        mode: full
        grokDefault: 'on'
        maxConcurrency: 2
        timeoutMs: 1200000
        childTimeoutMs: 420000
        loopEnabled: false
        roles:
          planner:
            - provider: soak-live
              model: agent2api/deepseek-v4.1-flash
          worker:
            - provider: soak-live
              model: agent2api/deepseek-v4.1-flash
          verifier:
            - provider: soak-live
              model: agent2api/deepseek-v4.1-flash
          supervisor:
            - provider: soak-live
              model: agent2api/deepseek-v4.1-flash
          synthesizer:
            - provider: soak-live
              model: agent2api/deepseek-v4.1-flash
