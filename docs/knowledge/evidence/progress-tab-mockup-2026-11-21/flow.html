<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<title>进度 Tab — 可点击的流程图效果图</title>
<style>
  html[data-theme="light"] {
    --label: #1f2328; --label2: #6b7280; --inverse: #ffffff;
    --line: #d8dde4; --fill: #f2f4f7; --page: #ffffff; --layer2: #ffffff;
    --ok: #15803d; --run: #2f6fed; --bad: #d1242f; --warn: #b45309; --idle: #c3c9d2;
    --shadow: 0 14px 36px rgba(16, 24, 40, .16);
  }
  html[data-theme="dark"] {
    --label: #e6e8eb; --label2: #98a1ac; --inverse: #0e1116;
    --line: #39414b; --fill: #222831; --page: #14181e; --layer2: #1b2129;
    --ok: #46c07a; --run: #6aa6ff; --bad: #ff6b6b; --warn: #e0a33a; --idle: #4b535e;
    --shadow: 0 14px 36px rgba(0, 0, 0, .55);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--label);
    font-family: "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 13px; -webkit-font-smoothing: antialiased;
  }
  .chrome { padding: 14px 20px 0; border-bottom: 1px solid var(--line); }
  .chrome-title { font-size: 14px; font-weight: 600; display: flex; gap: 14px; align-items: center; }
  .chrome-title .mode { font-size: 12px; font-weight: 400; color: var(--label2); }
  .chrome-tabs { display: flex; gap: 22px; margin-top: 12px; font-size: 13px; color: var(--label2); }
  .chrome-tabs span { padding: 6px 0 9px; }
  .chrome-tabs .on { color: var(--label); font-weight: 600; box-shadow: inset 0 -2px 0 var(--run); }

  .gw-progress { position: relative; padding-bottom: 18px; }
  .gw-head { display: flex; align-items: center; gap: 10px; padding: 12px 20px 0; }
  .gw-head h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .gw-pct { color: var(--label2); font-variant-numeric: tabular-nums; }
  .gw-settle { display: flex; align-items: center; gap: 14px; padding: 10px 20px 0; font-size: 11px; color: var(--label2); }
  .gw-settle .bar { flex: 1 1 auto; display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--fill); }
  .gw-settle .bar i { display: block; height: 100%; }
  .gw-settle .bar i.ok { background: var(--ok); }
  .gw-settle .bar i.bad { background: var(--bad); }
  .gw-settle .bar i.open { background: repeating-linear-gradient(90deg, var(--idle) 0 5px, transparent 5px 9px); }

  .gw-flow { position: relative; margin-top: 4px; }
  .gw-wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .gw-flow > .gw-track, .gw-flow > .gw-tasks { position: relative; z-index: 1; }

  .gw-track { display: flex; align-items: stretch; width: 100%; padding: 12px 20px 6px; margin: 0; list-style: none; }
  .gw-seg {
    flex: 1 1 0; min-width: 0; display: flex; flex-direction: column;
    padding: 6px 10px 10px; border: 0; border-right: 1px solid var(--line);
    text-align: left;
  }
  .gw-seg:last-child { border-right: 0; }
  .gw-seg-head { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; min-height: 28px; }
  .gw-ring {
    flex: none; width: 28px; height: 28px; border: 2px solid var(--idle); border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center; font-size: 12px; line-height: 1;
  }
  .gw-label { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gw-meta { margin-top: 4px; font-size: 11px; color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gw-dur { display: block; height: 3px; margin-top: 7px; border-radius: 999px; background: var(--fill); }
  .gw-dur i { display: block; height: 100%; border-radius: 999px; background: var(--ok); }
  .gw-dur[data-state="doing"] i { background: var(--run); }
  .gw-dur[data-empty="true"] { background: repeating-linear-gradient(90deg, var(--line) 0 3px, transparent 3px 6px); }
  .gw-link { flex: 0 0 auto; align-self: flex-start; width: 18px; height: 2px; margin-top: 19px; border-radius: 999px; background: var(--line); }
  .gw-link[data-filled="true"] { background: var(--ok); }
  .gw-link[data-flowing="true"] { background: repeating-linear-gradient(90deg, var(--run) 0 6px, transparent 6px 10px); }

  .gw-tasks { margin: 18px 20px 0 0; padding: 0 0 0 470px; list-style: none; }
  .gw-task {
    display: flex; align-items: center; gap: 10px; min-height: 40px; margin-bottom: 10px;
    max-width: 700px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--layer2); text-align: left;
    width: 100%;
  }
  .gw-task[data-state="failed"] { border-left: 3px solid var(--bad); padding-left: 10px; }
  .gw-task[data-state="doing"] { border-color: var(--run); }
  .gw-task .gw-ring { width: 20px; height: 20px; font-size: 10px; }
  .gw-task-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gw-task-meta { font-size: 11px; color: var(--label2); font-variant-numeric: tabular-nums; flex: none; }
  .gw-subs { display: flex; align-items: center; margin-left: auto; flex: none; }
  .gw-pill {
    display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px;
    border: 1px solid var(--line); border-radius: 999px; font-size: 11px; background: transparent;
    color: inherit; font-family: inherit; cursor: pointer; text-decoration: none;
  }
  .gw-pill:hover { border-color: var(--run); }
  .gw-pill[data-state="failed"] { border-color: var(--bad); }
  .gw-pill[data-state="doing"] { border-color: var(--run); }
  .gw-pill .gw-ring { width: 12px; height: 12px; border-width: 2px; font-size: 8px; }
  .gw-mini { width: 22px; height: 2px; background: var(--line); position: relative; flex: none; }
  .gw-mini::after {
    content: ""; position: absolute; right: -1px; top: -3px;
    border-left: 5px solid var(--line); border-top: 4px solid transparent; border-bottom: 4px solid transparent;
  }
  .gw-mini[data-tone="ok"] { background: var(--ok); }
  .gw-mini[data-tone="ok"]::after { border-left-color: var(--ok); }
  .gw-mini[data-tone="bad"] { background: var(--bad); }
  .gw-mini[data-tone="bad"]::after { border-left-color: var(--bad); }
  .gw-mini[data-tone="pending"] { background: repeating-linear-gradient(90deg, var(--line) 0 3px, transparent 3px 6px); }

</style>
</head>
<body>
<div class="chrome">
  <div class="chrome-title">执行 ssh aigateway 告诉我上面… <span class="mode">标准模式</span></div>
  <div class="chrome-tabs"><span>对话</span><span>轨迹</span><span class="on">进度</span></div>
</div>

<div class="gw-progress">
  <div class="gw-head">
    <h3 id="run-title"></h3>
    <span class="gw-pct" id="run-pct"></span>
  </div>

  <!-- Always present once a run exists: an empty bar plus "no settled row yet" is the
       honest reading of a run that declared nothing (see ·settle.unsettled·). -->
  <div class="gw-settle">
    <div class="bar" id="settle-bar"></div>
    <span id="settle-text"></span>
  </div>

  <div class="gw-flow" id="flow">
    <ul class="gw-track" id="track" role="group" aria-label="流程"></ul>
    <ul class="gw-tasks" id="tasks"></ul>
    <svg class="gw-wires" id="wires" aria-hidden="true"></svg>
  </div>
</div>


<script>
const NS = 'http://www.w3.org/2000/svg'
const COLORS = { done: 'var(--ok)', doing: 'var(--run)', failed: 'var(--bad)', pending: 'var(--line)' }
const RING = { done: 'var(--ok)', doing: 'var(--run)', failed: 'var(--bad)', pending: 'var(--idle)' }
const GLYPH = { done: '✓', doing: '…', failed: '✕', pending: '' }
const STATE_TEXT = { done: '完成', doing: '进行中', failed: '失败', pending: '未报告' }
const TONE = { done: 'ok', doing: 'run', failed: 'bad', pending: 'pending' }

const RUN = {
  title: '任务团队 · 8 个任务',
  runId: 'wf-3f9a2c',
  percent: '7/11 · 64%',
  settled: [
    { tone: 'ok', label: '6 完成', width: '54.6%' },
    { tone: 'bad', label: '1 失败', width: '9.1%' },
    { tone: 'open', label: '4 未结算', width: '36.3%' },
  ],
}

const STAGES = [
  {
    key: 'start', name: '起点', state: 'done', meta: 'run 已开始', dur: 0,
    facts: [['runId', RUN.runId], ['行数', '0'], ['说明', 'run 已存在']],
    rows: [], report: null,
  },
  {
    key: 'plan', name: '规划', state: 'done', meta: '1/1 · 3 s', dur: 7,
    facts: [['runId', RUN.runId], ['行数', '1'], ['聚合 phase', '规划']],
    rows: [{ seq: 10, label: '规划', child: 'sub-plan', outcome: 'completed', dur: '3.0 s' }],
    report: null,
  },
  {
    key: 'execute', name: '执行', state: 'done', meta: '8 行 · 18 s', dur: 43,
    facts: [['runId', RUN.runId], ['行数', '8'], ['聚合 phase', '执行 / 任务 1…8']],
    rows: [], report: null,
  },
  {
    key: 'verify', name: '检查', state: 'doing', meta: '2 行在跑 · 12 s', dur: 29,
    facts: [['runId', RUN.runId], ['行数', '2'], ['聚合 phase', '检查']],
    rows: [
      { seq: 30, label: '检查', child: 'sub-v1', outcome: 'completed', dur: '9.4 s' },
      { seq: 31, label: '检查', child: 'sub-v2', outcome: undefined, dur: '2.6 s' },
    ],
    report: null,
  },
  {
    key: 'synthesize', name: '汇总', state: 'pending', meta: '事件中没有报告', dur: null,
    facts: [['runId', RUN.runId], ['行数', '0'], ['聚合 phase', '—']],
    rows: [], report: null,
  },
  {
    key: 'answer', name: '回答', state: 'pending', meta: '事件中没有报告', dur: null,
    facts: [['runId', RUN.runId], ['行数', '0'], ['聚合 phase', '—']],
    rows: [], report: null,
  },
  {
    key: 'end', name: '终点', state: 'pending', meta: '运行未结束', dur: null,
    facts: [['runId', RUN.runId], ['stopReason', '—'], ['说明', 'run 仍未结束']],
    rows: [], report: null,
  },
]

const TASKS = [
  {
    key: 't1', n: 1, title: '读代码', state: 'done', rows: '1/1', time: '4 s',
    members: [{ seq: 11, label: '执行', child: 'sub-1a', outcome: 'completed', dur: '4.0 s' }],
  },
  {
    key: 't2', n: 2, title: '定位入口', state: 'done', rows: '1/1', time: '6 s',
    members: [{ seq: 13, label: '执行', child: 'sub-2a', outcome: 'completed', dur: '6.1 s' }],
  },
  {
    key: 't3', n: 3, title: '复现缺陷', state: 'doing', rows: '0/1', time: '5 s',
    members: [{ seq: 15, label: '执行', child: 'sub-3a', outcome: undefined, dur: '5.2 s' }],
  },
  {
    key: 't4', n: 4, title: '改样式', state: 'done', rows: '2/2', time: '8 s',
    members: [
      { seq: 17, label: '执行', child: 'sub-4a', outcome: 'completed', dur: '5.0 s' },
      { seq: 18, label: '检查', child: 'sub-4b', outcome: 'completed', dur: '3.0 s' },
    ],
  },
  {
    key: 't5', n: 5, title: '补单测', state: 'done', rows: '2/2', time: '9 s',
    members: [
      { seq: 19, label: '执行', child: 'sub-5a', outcome: 'completed', dur: '5.4 s' },
      { seq: 20, label: '检查', child: 'sub-5b', outcome: 'completed', dur: '3.6 s' },
    ],
  },
  {
    key: 't6', n: 6, title: '真机截图', state: 'failed', rows: '1/2', time: '7 s',
    members: [
      { seq: 21, label: '执行', child: 'sub-6a', outcome: 'completed', dur: '4.2 s' },
      { seq: 22, label: '检查', child: 'sub-6b', outcome: 'failed', dur: '2.8 s' },
    ],
  },
  {
    key: 't7', n: 7, title: '更新文档', state: 'pending', rows: '0/1', time: '—',
    members: [{ seq: 23, label: '执行', child: 'sub-7a', outcome: undefined, dur: '—' }],
  },
  {
    key: 't8', n: 8, title: '收尾提交', state: 'pending', rows: '0/1', time: '—',
    members: [{ seq: 24, label: '执行', child: 'sub-8a', outcome: undefined, dur: '—' }],
  },
]

const el = (tag, cls, text) => {
  const node = document.createElement(tag)
  if (cls) node.className = cls
  if (text !== undefined) node.textContent = text
  return node
}
const ring = (state, small) => {
  const node = el('span', 'gw-ring', GLYPH[state])
  node.style.borderColor = RING[state]
  node.style.color = RING[state]
  node.dataset.state = state
  return node
}

/* ---------- header ---------- */
document.getElementById('run-title').textContent = RUN.title
document.getElementById('run-pct').textContent = RUN.percent
const bar = document.getElementById('settle-bar')
RUN.settled.forEach((part) => {
  const i = el('i', part.tone)
  i.style.width = part.width
  bar.appendChild(i)
})
document.getElementById('settle-text').textContent = RUN.settled.map((p) => p.label).join(' · ')

/* ---------- track: static, no detail card (Q1) ---------- */
const track = document.getElementById('track')
STAGES.forEach((stage, index) => {
  const li = el('li', 'gw-seg')
  li.dataset.key = stage.key
  li.dataset.state = stage.state

  const head = el('div', 'gw-seg-head')
  head.append(ring(stage.state), el('span', 'gw-label', stage.name))
  const dur = el('span', 'gw-dur')
  if (stage.dur === null) dur.dataset.empty = 'true'
  else { const fill = el('i'); fill.style.width = stage.dur + '%'; dur.dataset.state = stage.state; dur.appendChild(fill) }

  li.append(head, el('span', 'gw-meta', stage.meta), dur)
  track.appendChild(li)

  if (index < STAGES.length - 1) {
    const link = el('span', 'gw-link')
    if (stage.state === 'done') link.dataset.filled = 'true'
    if (STAGES[index + 1].state === 'doing') link.dataset.flowing = 'true'
    link.setAttribute('aria-hidden', 'true')
    track.appendChild(link)
  }
})

/* ---------- tasks: cards are inert (Q2); the pills jump straight to the child session ---------- */
const list = document.getElementById('tasks')
TASKS.forEach((task) => {
  const li = el('li', 'gw-task')
  li.dataset.key = task.key
  li.dataset.state = task.state

  li.append(ring(task.state), el('span', 'gw-task-name', `任务 ${task.n} · ${task.title}`), el('span', 'gw-task-meta', `${task.rows} · ${task.time}`))

  const subs = el('span', 'gw-subs')
  task.members.forEach((member, i) => {
    if (i > 0) {
      const mini = el('span', 'gw-mini')
      mini.dataset.tone = TONE[member.outcome === undefined ? 'pending' : (member.outcome === 'completed' ? 'done' : 'failed')]
      subs.appendChild(mini)
    }
    const state = member.outcome === undefined ? 'doing' : (member.outcome === 'completed' ? 'done' : 'failed')
    const pill = el('a', 'gw-pill')
    pill.dataset.state = state
    // mock jump: a real tab calls openChild(childId); here the href shows the target
    pill.href = `#child-${member.child}`
    pill.title = `打开子会话 ${member.child}（${member.label}）`
    pill.append(ring(state), document.createTextNode(member.label))
    subs.appendChild(pill)
  })
  li.appendChild(subs)
  list.appendChild(li)
})

/* ---------- wires ---------- */
function draw() {
  const flow = document.getElementById('flow')
  const svg = document.getElementById('wires')
  const seg = track.querySelector('[data-key="execute"]')
  const cards = [...list.querySelectorAll('.gw-task')]
  if (!seg || cards.length === 0) return

  const fr = flow.getBoundingClientRect()
  const sr = seg.getBoundingClientRect()
  const anchor = seg.querySelector('.gw-ring').getBoundingClientRect()
  const cx = anchor.left - fr.left + anchor.width / 2
  const top = sr.bottom - fr.top + 2

  const pad = Math.round(cx + 30)
  if (list.style.paddingLeft !== pad + 'px') list.style.paddingLeft = pad + 'px'

  svg.setAttribute('viewBox', `0 0 ${Math.round(fr.width)} ${Math.round(fr.height)}`)
  svg.replaceChildren()

  const lastCard = cards[cards.length - 1].getBoundingClientRect()
  const bottom = lastCard.top - fr.top + lastCard.height / 2

  const trunk = document.createElementNS(NS, 'path')
  trunk.setAttribute('d', `M${cx} ${top} L${cx} ${bottom}`)
  trunk.style.fill = 'none'
  trunk.style.stroke = COLORS.done
  trunk.style.strokeWidth = '2'
  svg.appendChild(trunk)

  cards.forEach((card) => {
    const r = card.getBoundingClientRect()
    const y = r.top - fr.top + r.height / 2
    const x = r.left - fr.left
    const tone = COLORS[card.dataset.state] || COLORS.pending

    const branch = document.createElementNS(NS, 'path')
    branch.setAttribute('d', `M${cx} ${y} L${x} ${y}`)
    branch.style.fill = 'none'
    branch.style.stroke = tone
    branch.style.strokeWidth = '2'
    if (card.dataset.state === 'doing') branch.style.strokeDasharray = '6 4'
    svg.appendChild(branch)

    const head = document.createElementNS(NS, 'polygon')
    head.setAttribute('points', `${x},${y} ${x - 8},${y - 4.5} ${x - 8},${y + 4.5}`)
    head.style.fill = tone
    svg.appendChild(head)
  })
}

/* ---------- theme + boot ---------- */
if (new URLSearchParams(location.search).get('theme') === 'dark') {
  document.documentElement.dataset.theme = 'dark'
}
draw()
requestAnimationFrame(draw)
if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw)
addEventListener('resize', draw)

</script>
</body>
</html>
