# Overlay for the isolated progress-tab Round 2 evidence instance (verify group B, 2026-11-15).
#
# Booted as:
#   DSH_HOME=<repo>/.dsh-home/r2 dsh gwprog2 --patch <this file> --port 3221 --host 127.0.0.1 --no-open
#
# Model credentials stay in the environment (BIFROST_VIRTUAL_KEY); nothing secret is
# written here. The model endpoint is the machine-local gateway on 127.0.0.1:18088,
# i.e. the same route the operator's own web profile uses — no network boundary is
# mocked, the model really answers.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      bifrost-completions:
        displayName: Completions
        api: openai-completions
        baseURL: http://127.0.0.1:18088/openai/v1
        apiKeyEnv: BIFROST_VIRTUAL_KEY
        reasoning: low
        compat:
          supportsDeveloperRole: false
          supportsStore: false
        models:
          - id: wb/cn:deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash (cn)
            contextWindow: 500000
            maxTokens: 65536
            input:
              - text
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: bifrost-completions
    model: wb/cn:deepseek-v4.1-flash
    reasoningEffort: low
# The web layer disables workflow-ptc; dsh-grok-workflow injects the workflowEngine
# service, so its provider has to be switched back on.
- id: workflow-ptc
  name: '@deepseek-ai/dsh-workflow-ptc'
  config:
    provider: spawn
  disabled: false
- id: grok-workflow
  name: dsh-grok-workflow
  config:
    grokDefault: off
    timeoutMs: 86400000
    maxActiveRuns: 4
    triageAsk: true
    roles:
      planner:
        - provider: bifrost-completions
          model: wb/cn:deepseek-v4.1-flash
      worker:
        - provider: bifrost-completions
          model: wb/cn:deepseek-v4.1-flash
      verifier:
        - provider: bifrost-completions
          model: wb/cn:deepseek-v4.1-flash
      synthesizer: []
  disabled: false
- id: ui-settings-general
  name: '@deepseek-ai/dsh-client-ui-settings-general'
  config:
    welcomeNoticeVersion: 2026-09-28.1
