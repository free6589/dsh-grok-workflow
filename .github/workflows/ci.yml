name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Upload generated lib for exact CI sync
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-lib-debug
          path: lib/
      - run: git diff --exit-code -- lib/
      - run: npm test
      - run: npm pack --dry-run
