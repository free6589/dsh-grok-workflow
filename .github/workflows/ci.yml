name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Commit exact compiler output for this repair
        if: matrix.node == '22' && github.event_name == 'pull_request'
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(build): sync exact TypeScript compiler output"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Upload generated lib for exact CI sync
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: generated-lib-debug
          path: lib/
      - name: Upload generated lib for exact CI sync
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-lib-debug
          path: lib/
      - run: git diff --exit-code -- lib/
      - run: npm test
      - run: npm pack --dry-run
